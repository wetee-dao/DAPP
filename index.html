<!DOCTYPE html>
<html lang="en" style="font-size: 16px;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlusWeb2 Cloud</title>
  <script>
    const theme = localStorage.getItem("theme") || "dark"
    document.documentElement.setAttribute("class", theme)
  </script>
  <script src="/config/apps.js"></script>
  <style>
    @font-face {
      font-family: "pixel-font";
      src: url('/fonts/DatCub-Regular.woff2') format('woff2'),
        url('/fonts/DatCub-Regular.woff') format('woff'),
        url('/fonts/DatCub-Regular.ttf') format('truetype');
    }

    /* @font-face {
      font-family: "pixel-font";
      src: url('/fonts/fusion-pixel-10px-monospaced-zh_hans.woff2') format('woff2'),
        url('/fonts/fusion-pixel-10px-monospaced-zh_hans.ttf') format('truetype');
    } */

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      margin: 0;
      /* //禁止用户复制黏贴 */
      /* // user-select: none; */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "Ubuntu";
    }

    html.dark {
      --g-primary-bg: rgb(12, 16, 19);
      --g-secondary-bg: rgb(13, 17, 20);
      --g-primary-text: rgb(80, 250, 130);
      --g-secondary-text: rgba(220, 220, 220);
      --g-gray-bg: rgb(148, 148, 148);

      --g-primary-bg-rgb: 12, 16, 19;
      --g-secondary-bg-rgb: 13, 17, 20;
      --g-primary-text-rgb: 80, 250, 130;
      --g-secondary-text-rgb: 220, 220, 220;
      --g-gray-bg-rgb: 148, 148, 148;
    }

    html.dark body {
      /* background-image: linear-gradient(143.28deg,#0000 37.81%,#07656f14 88.77%),linear-gradient(109.18deg,#06421e03 24.55%,#0000008c 45.87%,#00000050 58.82%,#0000 86.5%),linear-gradient(171.51deg,#2d312d33 31.48%,#0526081f 69.53%,#0314051a 93.83%),linear-gradient(#0000007a,#000f0a);
      background-size: 100% 100%;
      background-position: center center; */

      background-color: var(--g-primary-bg);
      background-size: 100% 100%;
      background-position: center center;
      
      background-image: linear-gradient(143.28deg,#0000 37.81%,#07656f12 88.77%),linear-gradient(109.18deg,#00131d14 24.55%,#0000008b 45.87%,#00000050 58.82%,#0000 86.5%),linear-gradient(171.51deg,#00240314 31.48%,#0526081f 69.53%,#0314051a 93.83%),linear-gradient(#03071f00,#000);
      
    }

    html.light {
      --g-primary-bg: rgb(212, 216, 231);
      --g-secondary-bg: rgb(198, 203, 220);
      --g-primary-text: rgb(21, 132, 54);
      --g-secondary-text: rgb(34, 34, 34);
      --g-gray-bg: rgb(0, 67, 45);

      --g-primary-bg-rgb: 212, 216, 231;
      --g-secondary-bg-rgb: 198, 203, 220;
      --g-primary-text-rgb: 21, 132, 54;
      --g-secondary-text-rgb: 34, 34, 34;
      --g-gray-bg-rgb: 0, 67, 45;
    }

    html.light body {
      /* background-image: linear-gradient(90deg, rgba(var(--g-secondary-text-rgb), 0.02) 3%, transparent 0),
        linear-gradient(rgba(var(--g-secondary-text-rgb), 0.02) 3%, transparent 0); */
    }

    body {
      background-position: 0 12px;
      background-size: 1.4rem 1.4rem;
      background-color: var(--g-primary-bg);
      color: var(--g-primary-text);
    }

    #loader {
      position: absolute;
      top: calc(50vh - 50Px);
      left: calc(50vw - 150Px);
      text-align: center;
      display: flex;
    }

    .loader-logo {
      width: 60Px;
      height: 60Px;
      color: var(--g-primary-text);
      font-size: 30px;
      position: relative;
      left: -6px;
    }

    .loading-text {
      font-size: 28Px;
      line-height: 1;
      color: rgba(var(--g-primary-text-rgb), 1);
      font-family: "pixel-font", Serif;
      width: 180Px;
    }

    .loader-logo:before,
    .loader-logo:after {
      content: '';
      display: block;
      position: absolute;
      background-color: currentcolor;
      left: 50%;
      right: 0;
      top: 0;
      bottom: 50%;
      box-shadow: -.5em 0 0 currentcolor;
      -webkit-animation: loader-logo 1s linear infinite;
      animation: loader-logo 1s linear infinite;
    }

    .loader-logo:after {
      top: 50%;
      bottom: 0;
      -webkit-animation-delay: .25s;
      animation-delay: .25s;
    }

    @-webkit-keyframes loader-logo {

      0%,
      100% {
        box-shadow: -.5em 0 0 transparent;
        background-color: currentcolor;
      }

      50% {
        box-shadow: -.5em 0 0 currentcolor;
        background-color: transparent;
      }
    }

    @keyframes loader-logo {

      0%,
      100% {
        box-shadow: -.5em 0 0 transparent;
        background-color: currentcolor;
      }

      50% {
        box-shadow: -.5em 0 0 currentcolor;
        background-color: transparent;
      }
    }

    body {
      background-color: var(--g-primary-bg);
    }
  </style>
</head>

<body>
  <div id="mainApp"></div>
  <div id="loader">
    <div class="loader-logo"></div>
    <div class="loading-text">Connecting to PlusWeb2</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
