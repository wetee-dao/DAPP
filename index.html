<!DOCTYPE html>
<html lang="en" style="font-size: 16px;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>plus web2 cloud</title>
  <script>
    const theme = localStorage.getItem("theme") || "dark"
    document.documentElement.setAttribute("class", theme)
  </script>
  <script src="/config/apps.js"></script>
  <style>
    @font-face {
      font-family: "pixel-font";
      src: url('/fonts/DatCub-Regular.woff2') format('woff2'),
        url('/fonts/DatCub-Regular.woff') format('woff'),
        url('/fonts/DatCub-Regular.ttf') format('truetype');
    }

    /* @font-face {
      font-family: "pixel-font";
      src: url('/fonts/fusion-pixel-10px-monospaced-zh_hans.woff2') format('woff2'),
        url('/fonts/fusion-pixel-10px-monospaced-zh_hans.ttf') format('truetype');
    } */

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      margin: 0;
      /* //禁止用户复制黏贴 */
      /* // user-select: none; */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "Ubuntu";
    }

    html.dark {
      /* 主背景与官网一致 */
      --g-primary-bg: rgb(12, 16, 19);
      --g-secondary-bg: rgb(13, 17, 20);
      --g-primary-text: rgb(88, 232, 152);
      --g-secondary-text: rgb(214, 216, 220);
      --g-gray-bg: rgb(124, 126, 132);

      --g-primary-bg-rgb: 12, 16, 19;
      --g-secondary-bg-rgb: 13, 17, 20;
      --g-primary-text-rgb: 88, 232, 152;
      --g-secondary-text-rgb: 214, 216, 220;
      --g-gray-bg-rgb: 124, 126, 132;
    }

    html.dark body {
      background-color: var(--g-primary-bg);
    }

    html.light {
      /* 浅灰底略偏冷，正文炭灰、主绿略沉一点 */
      --g-primary-bg: rgb(246, 247, 249);
      --g-secondary-bg: rgb(235, 236, 240);
      --g-primary-text: rgb(22, 118, 62);
      --g-secondary-text: rgb(42, 44, 48);
      --g-gray-bg: rgb(18, 82, 54);

      --g-primary-bg-rgb: 246, 247, 249;
      --g-secondary-bg-rgb: 235, 236, 240;
      --g-primary-text-rgb: 22, 118, 62;
      --g-secondary-text-rgb: 42, 44, 48;
      --g-gray-bg-rgb: 18, 82, 54;
    }

    html.light body {
    }

    body {
      background-color: var(--g-primary-bg);
      color: var(--g-primary-text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    #loader {
      position: absolute;
      top: calc(50vh - 50Px);
      left: calc(50vw - 150Px);
      text-align: center;
      display: flex;
    }

    .loader-logo {
      width: 60Px;
      height: 60Px;
      color: var(--g-primary-text);
      font-size: 30px;
      position: relative;
      left: -6px;
    }

    .loading-text {
      font-size: 28Px;
      line-height: 1;
      color: rgba(var(--g-primary-text-rgb), 1);
      font-family: "pixel-font", Serif;
      width: 180Px;
    }

    .loading-text.loading-text--error {
      width: min(92vw, 520px);
      font-size: 16px;
      line-height: 1.35;
      color: #f87171;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .loader-logo:before,
    .loader-logo:after {
      content: '';
      display: block;
      position: absolute;
      background-color: currentcolor;
      left: 50%;
      right: 0;
      top: 0;
      bottom: 50%;
      box-shadow: -.5em 0 0 currentcolor;
      -webkit-animation: loader-logo 1s linear infinite;
      animation: loader-logo 1s linear infinite;
    }

    .loader-logo:after {
      top: 50%;
      bottom: 0;
      -webkit-animation-delay: .25s;
      animation-delay: .25s;
    }

    @-webkit-keyframes loader-logo {

      0%,
      100% {
        box-shadow: -.5em 0 0 transparent;
        background-color: currentcolor;
      }

      50% {
        box-shadow: -.5em 0 0 currentcolor;
        background-color: transparent;
      }
    }

    @keyframes loader-logo {

      0%,
      100% {
        box-shadow: -.5em 0 0 transparent;
        background-color: currentcolor;
      }

      50% {
        box-shadow: -.5em 0 0 currentcolor;
        background-color: transparent;
      }
    }
  </style>
</head>

<body>
  <div id="mainApp"></div>
  <div id="loader">
    <div class="loader-logo"></div>
    <div class="loading-text">Connecting to PlusWeb2</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
